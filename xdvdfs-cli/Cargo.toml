[package]
name = "xdvdfs-cli"
description = "Tool for interacting with XISO/XDVDFS images"
keywords = ["cli", "filesystem", "xdvdfs"]
default-run = "xdvdfs"

version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

exclude = ["**/*.iso", "**/*.xiso"]

[dependencies]
xdvdfs = { path = "../xdvdfs-core", version = "0.9.0" }
clap = { version = "4.2.1", features = ["derive"] }
md-5 = { version = "0.10.5", default-features = false }
anyhow = "1.0.71"
env_logger = "0.10.0"
ciso = { version = "0.3.0", default-features = false, features = ["sync"] }

[[bin]]
name = "xdvdfs"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3.20.0"
