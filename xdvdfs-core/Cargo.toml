[package]
name = "xdvdfs"
description = "Library for interacting with XISO/XDVDFS images"
keywords = ["filesystem", "xdvdfs"]

version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

exclude = ["**/*.iso", "**/*.xiso"]

[dependencies]
encoding_rs = "0.8.32"
thiserror = "2.0.14"
log = "0.4.17"
sha3 = "0.10.8"
lz4_flex = { version = "0.11.6", default-features = false, features = ["safe-encode", "safe-decode"] }

[lib]

[dev-dependencies]
rand = "0.9.3"
tempfile = "3.20.0"
