[package]
name = "xdvdfs"
description = "Library for interacting with XISO/XDVDFS images"
keywords = ["filesystem", "xdvdfs"]

version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

exclude = ["**/*.iso", "**/*.xiso"]

[lints]
workspace = true

[dependencies]
encoding_rs = "0.8.42"
thiserror = "2.0.21"
log = "0.4.34"
sha3 = "0.12.0"
lz4_flex = { version = "0.14.0", default-features = false, features = ["safe-encode", "safe-decode"] }

[lib]

[dev-dependencies]
rand = "0.10.3"
tempfile = "3.27.0"
