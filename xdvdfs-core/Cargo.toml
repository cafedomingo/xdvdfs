[package]
name = "xdvdfs"
description = "Library for interacting with XISO/XDVDFS images"
keywords = ["filesystem", "xdvdfs"]

version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

exclude = ["**/*.iso", "**/*.xiso"]

[dependencies]
bincode = "1.3.3"
proc-bitfield = "0.2.2"
serde = { version = "1.0.159", features = ["derive"] }
serde-big-array = "0.5.1"
encoding_rs = "0.8.32"
thiserror = "2.0.14"
log = "0.4.17"
sha3 = "0.10.8"
ciso = { version = "0.3.0", default-features = false, features = ["sync"] }

[lib]

[dev-dependencies]
rand = "0.9.3"
tempfile = "3.20.0"
