[workspace]
members = ["xdvdfs-core", "xdvdfs-cli"]
resolver = "3"

[workspace.package]
license = "MIT"
version = "1.0.0"
edition = "2024"
rust-version = "1.99"
repository = "https://github.com/cafedomingo/xdvdfs"
homepage = "https://github.com/cafedomingo/xdvdfs"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
strip = true
lto = true
