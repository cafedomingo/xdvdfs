name: Dependabot auto-merge

on: pull_request

permissions: {}

jobs:
  # Turns on auto-merge for Dependabot's minor and patch updates. The merge itself waits for
  # the ruleset's required checks; majors stay manual.
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'cafedomingo/xdvdfs'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - if: steps.meta.outputs.update-type == 'version-update:semver-minor' || steps.meta.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ github.token }}
